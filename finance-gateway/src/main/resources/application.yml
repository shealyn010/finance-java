server:
  port: 8080

spring:
  application:
    name: finance-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: transaction-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/work-order/**,/api/agent/**
